spring.application.name=viaticos
server.port=8099

spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/viaticos
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_ACCESS_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.security.cookies.secure=${SECURE_COOKIES:false}
app.security.cookies.same-site=${COOKIE_SAME_SITE:Lax}
app.security.cors.origins=${APP_CORS_ORIGINS:http://localhost:5500,http://localhost:5501,http://127.0.0.1:5500,http://127.0.0.1:5501,https://viaticos.grupovo.com.mx}

google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

app.storage.path=${APP_STORAGE_PATH:uploads}

app.security.seed-admin.enabled=${SEED_ADMIN_ENABLED:false}
app.security.seed-admin.username=${SEED_ADMIN_USERNAME:}
app.security.seed-admin.password=${SEED_ADMIN_PASSWORD:}
