spring.application.name=viaticos
server.port=8099

spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/viaticos
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

application.security.jwt.secret-key=${JWT_SECRET_KEY:miClaveSecretaMuySeguraQueEsLoSuficientementeLarga}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

google.maps.api-key=${GOOGLE_MAPS_API_KEY:AIzaSyCXaUEBD-iMMLgIBFkrnkm7ovYi97nhUg8}

app.security.seed-admin.enabled=${SEED_ADMIN_ENABLED:true}
app.security.seed-admin.username=${SEED_ADMIN_USERNAME:admin}
app.security.seed-admin.password=${SEED_ADMIN_PASSWORD:Admin123}
